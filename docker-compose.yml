services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  # One-shot init that pulls a default model into the running ollama service
  ollama-init:
    image: ollama/ollama:latest
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_INIT_MODEL=gemma:2b
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-lc"]
    command: >
      until ollama list >/dev/null 2>&1; do echo "Waiting for ollama..."; sleep 2; done;
      echo "Pulling $OLLAMA_INIT_MODEL...";
      ollama pull "$OLLAMA_INIT_MODEL" || true;
      echo "Ollama model ready.";
      exit 0
    restart: "no"

  app:
    build: .
    environment:
      - EBOOKSUM_ENV=dev
      - EBOOKSUM_API_BASE=http://ollama:11434/api
      - HF_HOME=/data/hf
      - TRANSFORMERS_CACHE=/data/transformers
      - EBOOKSUM_MODEL=gemma:2b
      - EBOOKSUM_PROMPT=bnotes
    volumes:
      - ./runs:/app/runs
      - ./models:/models
      - ./gemma2b-cnn-lora:/app/gemma2b-cnn-lora
      - hf-cache:/data/hf
      - hf-transformers:/data/transformers
    ports:
      - "8501:8501"
    depends_on:
      - ollama
      - ollama-init

volumes:
  ollama-data:
  hf-cache:
  hf-transformers:
