version: "3.9"
services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  app:
    build: .
    environment:
      - EBOOKSUM_ENV=dev
      - EBOOKSUM_API_BASE=http://ollama:11434/api
    volumes:
      - ./runs:/app/runs
    ports:
      - "8501:8501"
    depends_on:
      - ollama

volumes:
  ollama-data:

